name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Ubuntu 23.10+ blocks Chrome's unprivileged sandbox; run without it in CI
      - run: echo '{"args":["--no-sandbox","--disable-dev-shm-usage"]}' > /tmp/puppeteer-ci.json
      - run: npm test
        env:
          MERMAID_PUPPETEER_CONFIG: /tmp/puppeteer-ci.json
